name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: make e2e

  # A fresh runner is the clean machine: nothing is installed or cached for `make demo`.
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          make demo > demo.log 2>&1 &
          for attempt in $(seq 1 180); do
            if curl --silent --fail http://127.0.0.1:4317/api/v1/repositories > repositories.json 2>/dev/null; then
              break
            fi
            sleep 5
          done
          cat demo.log | tail -20
          id=$(python3 -c "import json; print(json.load(open('repositories.json'))[0]['id'])")
          curl --silent --fail "http://127.0.0.1:4317/api/v1/repositories/$id/overview" | grep -q '"commit_count":180'
          curl --silent --fail "http://127.0.0.1:4317/api/v1/repositories/$id/backtests" | grep -q '"evaluated_cases"'
          curl --silent --fail http://127.0.0.1:4317/ | grep -q '<div id="root">'

  verify:
    runs-on: ubuntu-latest
    env:
      KY_COMMIT: 3541888878c4d303a8bc2ad61815f4e048f55a5d
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: apps/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/web
      - run: |
          git clone --quiet https://github.com/sindresorhus/ky "$RUNNER_TEMP/ky"
          git -C "$RUNNER_TEMP/ky" checkout --quiet "$KY_COMMIT"
      - run: make verify REPO="$RUNNER_TEMP/ky"

